# mujik-transcriptor default config
# 见 docs/design.md §5
# v0.5.2：删除所有"改了不生效"的死配置字段（polyphonic_threshold/
# velocity_threshold/max_polyphony/allow_user_override/confidence_threshold/
# chord.models/custom_groove_path/include_lyrics）——schema 已同步收窄

input_path: ""           # CLI 注入
output_dir: "./out"
preset: "custom"

source_separation:
  stem_count: 4
  model: "demucs"
  variant: "htdemucs_ft"
  device: "cuda"
  precision: "fp16"
  segment_length: 7.5
  overlap: 0.25
  jobs: 1
  out_bitrate: 256
  out_format: "wav"

transcribe:
  vocals: "basic-pitch"
  bass: "basic-pitch"
  drums: "drumscript"  # v0.5.2：adtof 弃用（原仓库死链 + CC-BY-NC-SA 权重）
  piano: "bytedance-piano"
  guitar: "apollo"
  other: "basic-pitch"
  min_note_length_ms: 50.0
  # v0.5.3: basic-pitch 全局配置 + per-stem 覆盖（stem_basic_pitch 优先）。
  # v0.5.3: 删除 onset_interval_min_ms——router 曾把它除以 100 冒充
  # onset 概率阈值（类型说谎），现阈值在 basic_pitch/stem_basic_pitch 里直配
  basic_pitch:
    onset_threshold: 0.5
    frame_threshold: 0.3
    min_note_length_ms: 50.0
    min_frequency: null      # Hz；null = 不限
    max_frequency: null
  stem_basic_pitch:
    vocals:
      min_frequency: 130.0   # 人声基频带 ~C3-C6，滤 bass 低频泄漏
      max_frequency: 1050.0
    bass:
      min_frequency: 27.0    # 低音乐器带，防高频泄漏出幻觉 note
      max_frequency: 440.0
      onset_threshold: 0.6
    other:                   # 残渣混合 stem：双阈值 + 更长最短时值
      onset_threshold: 0.6
      frame_threshold: 0.4
      min_note_length_ms: 100.0

rhythm:
  # v0.5.2：schema Literal 收窄到实际实现，设其他值在加载期即报错
  # （此前 beat-transformer/beatnet/resnet18 从未存在，是"预留位"式说谎）
  beat_tracker: "madmom"
  time_signature_model: "heuristic-downbeat"

chord:
  enabled: false
  vocab: "extended"

quantize:
  enabled: true
  grid_resolution: 16
  strength: 0.8
  groove_template: "straight"

merge:
  mode: "piano_reduction"
  density_filter: true
  max_simultaneous_notes: 12
  preserve_drums: true
  preserve_voice_separate: true

render:
  pdf_backend: "verovio"
  lilypond_url: "http://localhost:5001"
  musescore_url: "http://localhost:5002"
  include_chord_symbols: true
  page_size: "A4"
  staff_count: 2
  timeout_sec: 60
